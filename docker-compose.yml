# RSSHub deployment for Portainer (nj106 fork).
# - host port 1200 -> container 1200
# - attached to the shared `rsshub-net` network (external) so FreshRSS can
#   reach it at http://rsshub:1200 via Docker's embedded DNS.
#   (Exception to the bridge-only rule: see freshrss compose for details.)
# NOTE: this file replaces upstream's docker-compose.yml for Portainer Git deployment.
services:
    rsshub:
        image: diygod/rsshub:chromium-bundled
        container_name: rsshub
        labels:
            - com.centurylinklabs.watchtower.enable=true
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:1200/healthz || exit 1']
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 60s
        ports:
            - '1200:1200'
        environment:
            TZ: 'Asia/Shanghai'
            REQUEST_TIMEOUT: '60000'
            REQUEST_RETRY: '4'
        networks:
            - rsshub-net

networks:
    rsshub-net:
        external: true
